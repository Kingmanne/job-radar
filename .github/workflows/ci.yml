name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write       # OIDC: swap the GitHub token for short-lived AWS credentials
  pull-requests: write  # post the plan as a PR comment

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  plan:
    needs: test
    runs-on: ubuntu-latest
    # Fork PRs get no OIDC token; only run for branches in this repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: eu-west-2
      - name: Write tfvars from secret
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: printf '%s\n' "$TF_VARS" > terraform.tfvars
      - run: terraform fmt -check -recursive -diff
      - run: terraform init -input=false
      - run: terraform validate -no-color
      - name: Plan (read-only, no lock)
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
      - name: Comment plan on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const summary = (plan.match(/^(Plan: .*|No changes\..*)$/m) || ['(see log)'])[0];
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (truncated, see the job log)';
            const marker = '<!-- terraform-plan -->';
            const body = `${marker}\n### Terraform plan: ${summary}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
      - name: Stop if the plan would destroy anything
        run: |
          if grep -qE '^Plan: .* [1-9][0-9]* to destroy' plan.txt; then
            echo "::error::This plan destroys resources. Review it, and apply from your Mac if it is intended."
            exit 1
          fi
